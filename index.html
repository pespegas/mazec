  #editor button{flex:none;width:calc(38*var(--u));height:calc(38*var(--u));min-width:28px;min-height:28px;border-radius:calc(8*var(--u));

       border-radius:calc(60*var(--u));background:#ffffff22;border:2px solid #fff6;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:calc(54*var(--u));height:calc(54*var(--u));margin:calc(-27*var(--u));
        border-radius:50%;background:#fffa;pointer-events:none}
  .tb{position:absolute;bottom:calc(24*var(--u));width:calc(84*var(--u));height:calc(84*var(--u));border-radius:50%;
      background:#2f7bf5cc;border:3px solid #fff;color:#fff;font-size:calc(40*var(--u));text-align:center;
      line-height:calc(80*var(--u));font-weight:700;touch-action:none}
  #bJump{right:calc(20*var(--u))} #bLeap{right:calc(120*var(--u));background:#f29a2fcc}

<body>
<div id="rot"><div>📱↻<br>Otoč telefon naležato<br><br><button class="btn" id="rotBtn" style="font-size:16px;padding:10px 20px">Chci hrát i tak!</button></div></div>

<script>
// =====================================================================
//  MAZEC – hra o mazání světa
// =====================================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxsFob2Ml4kJl5hlpYG_KO0ith_hgjoo9NiEAr1V3sU6O3R9xAD_Sn8rrlMY67VOFtV/exec';   // ← sem se vloží adresa serveru (Google Apps Script). Prázdné = vše jen v tomto prohlížeči.

const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){ mem[k] = String(v); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

const VW = 900, VH = 450, C = 6, ROWS = VH / C, GT = 390, TILE = 30, ED_COLS = 80, ED_ROWS = 15;
const R = 20, COST = 0.14, GUM_MAX = 100;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), wrap = $('wrap');
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function fit(){ wrap.style.setProperty('--u', (wrap.clientWidth / VW) + 'px'); }
addEventListener('resize', fit); fit();
if (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');

$('rotBtn').onclick = () => $('rot').style.setProperty('display', 'none', 'important');

// ---------- zvuk a hudba ----------
let ac, muted = store.get('mazec_mute') === '1', musicTimer = null, mstep = 0;
function audio(){ try{ ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume(); }catch(e){} }
function sfx(f, d = .1, type = 'square', v = .04){
  if (muted) return;
  try{ audio(); const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); }catch(e){}
}
const MEL = [0,2,4,7,9,7,4,2, 0,2,4,7,12,9,7,4, -3,0,2,4,7,4,2,0, 0,4,7,4,2,-1,0,null];
function startMusic(){
  if (musicTimer) return; audio();
  musicTimer = setInterval(() => {
    if (muted || document.hidden) return;
    const n = MEL[mstep % MEL.length];
    if (n !== null) sfx(261.63 * Math.pow(2, n / 12), .26, 'triangle', .02);
    if (mstep % 4 === 0) sfx(130.8 * Math.pow(2, [0, 0, -3, 0][(mstep >> 3) % 4] / 12), .5, 'sine', .035);
    mstep++;
  }, 230);
}
function toggleMute(){ muted = !muted; store.set('mazec_mute', muted ? '1' : '0'); if (!muted) startMusic(); }

// ---------- účet, postup a server (potichu na pozadí) ----------
let user = null, prog = { best: {}, reached: 1, char: { shirt: '#2f7bf5', pants: '#20304f', hat: null, hair: '#6b3f20', skin: '#f2b27c' } };
let customLevels = [];
try{ user = JSON.parse(store.get('mazec_user')); }catch(e){}
try{ customLevels = JSON.parse(store.get('mazec_levels')) || []; }catch(e){}

async function api(body){
  if (!API_URL) return null;
  try{ const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }); return await r.json(); }
  catch(e){ return { ok: false, error: 'net' }; }
}
async function apiGet(q){
  if (!API_URL) return null;
  try{ const r = await fetch(API_URL + '?' + q); return await r.json(); }catch(e){ return null; }
}
function sha256js(str){      // záložní SHA-256 (stejný výsledek jako vestavěný)
  const m = new TextEncoder().encode(str), l = m.length, k = [], h = [];
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let c = 2, n = 0; n < 64; c++){ let p = true; for (let d = 2; d * d <= c; d++) if (c % d === 0){ p = false; break; }
    if (p){ if (n < 8) h[n] = (Math.pow(c, .5) % 1) * 4294967296 | 0; k[n++] = (Math.cbrt(c) % 1) * 4294967296 | 0; } }
  const bl = ((l + 8) >> 6) + 1, w = new Uint8Array(bl * 64); w.set(m); w[l] = 128;
  const dv = new DataView(w.buffer); dv.setUint32(bl * 64 - 4, l * 8); dv.setUint32(bl * 64 - 8, Math.floor(l * 8 / 4294967296));
  for (let o = 0; o < bl * 64; o += 64){
    const x = new Array(64); for (let i = 0; i < 16; i++) x[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++){ const s0 = rr(x[i - 15], 7) ^ rr(x[i - 15], 18) ^ (x[i - 15] >>> 3), s1 = rr(x[i - 2], 17) ^ rr(x[i - 2], 19) ^ (x[i - 2] >>> 10); x[i] = (x[i - 16] + s0 + x[i - 7] + s1) | 0; }
    let [a, b, c, d, e, f, g2, hh] = h;
    for (let i = 0; i < 64; i++){
      const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g2)) + k[i] + x[i]) | 0, t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g2; g2 = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g2, hh].forEach((v, i) => h[i] = (h[i] + v) | 0);
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}
async function sha(s){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ return sha256js(s); }
}
const NICK_RE = /^[A-Za-z0-9_áčďéěíňóřšťúůýžÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{3,16}$/;

function loadProg(serverProg){
  let loc = {}; try{ loc = JSON.parse(store.get('mazec_prog_' + user.nick)) || {}; }catch(e){}
  const sp = serverProg || {}, best = {};
  for (const src of [loc.best || {}, sp.best || {}]) for (const k in src) best[k] = best[k] ? Math.min(best[k], src[k]) : src[k];
  const def = { shirt: '#2f7bf5', pants: '#20304f', hat: null, hair: '#6b3f20', skin: '#f2b27c' };
  prog = { best, reached: Math.max(1, loc.reached || 1, sp.reached || 1), char: Object.assign(def, loc.char, sp.char) };
  saveProg();
}
let syncT;
function saveProg(){
  if (!user) return;
  store.set('mazec_prog_' + user.nick, JSON.stringify(prog));
  clearTimeout(syncT);
  syncT = setTimeout(() => api({ action: 'save', nick: user.nick, hash: user.hash, progress: prog }), 800);
}
async function doAuth(kind, nick, pass){
  nick = nick.trim();
  if (!NICK_RE.test(nick)) return 'Přezdívka: 3–16 znaků, bez mezer';
  if (pass.length < 4) return 'Heslo: aspoň 4 znaky';
  const hash = await sha('mazec:' + nick.toLowerCase() + ':' + pass);
  let res = await api({ action: kind, nick, hash });
  if (res === null){            // bez serveru – účet jen v tomto prohlížeči
    const users = JSON.parse(store.get('mazec_users') || '{}'), k = nick.toLowerCase();
    if (kind === 'register'){ if (users[k]) return 'Přezdívka už existuje'; users[k] = hash; store.set('mazec_users', JSON.stringify(users)); }
    else if (users[k] !== hash) return 'Špatná přezdívka nebo heslo';
    res = { ok: true, nick, progress: null };
  } else if (!res.ok){
    return res.error === 'exists' ? 'Přezdívka už existuje' : res.error === 'bad' ? 'Špatná přezdívka nebo heslo' :
           res.error === 'net' ? 'Nelze se spojit, zkus to znovu' : 'Něco se pokazilo';
  }
  user = { nick: res.nick || nick, hash }; store.set('mazec_user', JSON.stringify(user)); loadProg(res.progress);
  refreshLevels(); return null;
}
function cacheLevels(){ store.set('mazec_levels', JSON.stringify(customLevels)); }
async function refreshLevels(){
  const res = await apiGet('action=levels');
  if (res && res.ok){ customLevels = res.levels; cacheLevels(); }
}
async function silentLogin(){
  if (!user) return;
  loadProg(null);
  const res = await api({ action: 'login', nick: user.nick, hash: user.hash });
  if (res && res.ok) loadProg(res.progress);
  refreshLevels();
}

// ---------- stav hry ----------
let W, cols, g, fg, fakes, objs, spawns, parts, door, door2, bonus = false;
let lvl = 1, curDef = null, hearts = 10, gum, keys, timeLeft, elapsed = 0, T = 0, camX = 0, shake = 0;
let P, safe, safeT, doorCD = 0, paused = true, gumWarn = 0, mode = 'menu', savedHearts = 10;
let stroke = { n: 0 };

// ---------- mapa (mřížka buněk) ----------
function cell(cx, cy){ if (cx < 0 || cx >= cols) return 1; if (cy < 0 || cy >= ROWS) return 0; return g[cy * cols + cx]; }
function hit(x, y, w, h){
  const x0 = Math.floor((x - w / 2) / C), x1 = Math.floor((x + w / 2 - .01) / C);
  const y0 = Math.floor((y - h) / C),     y1 = Math.floor((y - .01) / C);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (cell(cx, cy)) return true;
  return false;
}
function fill(x, y, w, h, type, fid = 0){
  const x0 = Math.floor(x / C), x1 = Math.ceil((x + w) / C) - 1, y0 = Math.floor(y / C), y1 = Math.ceil((y + h) / C) - 1;
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){
    if (cx < 0 || cx >= cols || cy < 0 || cy >= ROWS) continue;
    const i = cy * cols + cx; g[i] = type; fg[i] = fid; if (fid) fakes[fid - 1].cells.push(i);
  }
}
const clearR = (x, y, w, h) => fill(x, y, w, h, 0);

// ---------- stavebnice levelů ----------
const mkEnemy = (x, y, sp, aggro) => ({ t: 'enemy', x, y, vx: 0, vy: 0, w: 26, h: 28, sp, aggro, face: 1, grounded: false, r: 16 });
const mkBoss = x => ({ t: 'enemy', boss: true, x, y: GT, vx: 0, vy: 0, w: 80, h: 90, sp: 65, aggro: 900, face: -1, grounded: false, r: 45, leapT: 2.5 });
const B = {
  ground: (a, b) => fill(a, GT, b - a, 60, 1),
  pit:    (a, b) => clearR(a, GT, b - a, 60),
  wall:   (x, w = 30, t = 0, b = GT) => fill(x, t, w, b - t, 3),
  block:  (x, y, w, h) => fill(x, y, w, h, 1),
  fakeAt: (x, y, w, h) => { clearR(x, y, w, h); fakes.push({ cells: [], t: null }); fill(x, y, w, h, 2, fakes.length); },
  fake:   (x, w) => { clearR(x, GT, w, 60); fakes.push({ cells: [], t: null }); fill(x, GT, w, 60, 2, fakes.length); },
  enemy:  (x, sp = 70, aggro = 600, y = GT) => objs.push(mkEnemy(x, y, sp, aggro)),
  boss:   x => objs.push(mkBoss(x)),
  ambush: (trig, x, sp = 100, aggro = 3000, y = GT) => spawns.push({ trig, e: mkEnemy(x, y, sp, aggro) }),
  spikes: (x, n) => { for (let i = 0; i < n; i++) objs.push({ t: 'spike', x: x + i * 20 + 10, y: GT, r: 10, vy: 0 }); },
  bomb:   x => objs.push({ t: 'bomb', x, y: GT, r: 14, cov: new Set(), vy: 0 }),
  key:    (x, y = GT - 40) => objs.push({ t: 'key', x, y, r: 12 }),
  heart:  (x, y = GT - 40) => objs.push({ t: 'heart', x, y, r: 12 }),
  sharp:  x => objs.push({ t: 'sharp', x, y: GT - 30, r: 14 }),
  door:   x => { door = { x, y: GT }; }
};

const BUILTIN = [
 { name: 'Level 1 – Zeď', hint: 'Chůze A D, skok mezerník. Drž myš a vymaž zeď!', w: 2000, time: 60, build(){
    B.ground(0, 2000); B.wall(600); B.wall(1100); B.wall(1500);
    [250, 450, 850, 1300, 1750, 1820].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1000, 330); B.door(1900); } },

 { name: 'Level 2 – Podlaha', hint: 'Nepřítel jde po tobě – vymaž podlahu pod ním!', w: 2200, time: 60, build(){
    B.ground(0, 2200); B.pit(1100, 1200); B.wall(1700);
    B.enemy(800, 70, 500); B.enemy(1450, 75, 500); B.enemy(1950, 80, 500);
    [300, 600, 1000, 1300, 1650, 2050].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1250, 330); B.sharp(1800); B.door(2120); } },

 { name: 'Level 3 – Utíkej a maž!', hint: 'Někdo ti jde v patách. Maž zdi za běhu!', w: 2400, time: 60, build(){
    B.ground(0, 2400); B.wall(700); B.wall(1200); B.wall(1700);

// ---------- vlastní levely (z editoru) ----------
function buildFromData(c){
  const rows = c.map.map(r => r.split(''));
  for (let gy = 11; gy < rows.length; gy++) for (const gx of [1, 2]) rows[gy][gx] = gy >= 13 ? 'G' : '.';   // místo pro start
  c = Object.assign({}, c, { objs: c.objs.filter(o => !isStartCell(o[1], o[2])) });
  for (let gy = 0; gy < rows.length; gy++) for (let gx = 0; gx < rows[gy].length; gx++){
    const ch = rows[gy][gx];
    if (ch === 'G') fill(gx * TILE, gy * TILE, TILE, TILE, 1); else if (ch === 'W') fill(gx * TILE, gy * TILE, TILE, TILE, 3);
  }
  const seen = new Set();
  for (let gy = 0; gy < rows.length; gy++) for (let gx = 0; gx < rows[gy].length; gx++){
    if (rows[gy][gx] !== 'F' || seen.has(gy * 1000 + gx)) continue;
    const q = [[gx, gy]], tiles = []; seen.add(gy * 1000 + gx);
    while (q.length){ const [x, y] = q.pop(); tiles.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ const nx = x + dx, ny = y + dy;
        if (rows[ny] && rows[ny][nx] === 'F' && !seen.has(ny * 1000 + nx)){ seen.add(ny * 1000 + nx); q.push([nx, ny]); } } }
    fakes.push({ cells: [], t: null }); const id = fakes.length;
    tiles.forEach(([x, y]) => fill(x * TILE, y * TILE, TILE, TILE, 2, id));
  }
  for (const [t, gx, gy] of c.objs){
    const x = gx * TILE + TILE / 2, fy = (gy + 1) * TILE, cy = gy * TILE + TILE / 2;
    if (t === 'E') objs.push(mkEnemy(x, fy, 70, 500));
    else if (t === 'S') objs.push({ t: 'spike', x, y: fy, r: 10, vy: 0 });
    else if (t === 'B') objs.push({ t: 'bomb', x, y: fy, r: 14, cov: new Set(), vy: 0 });
    else if (t === 'K') objs.push({ t: 'key', x, y: cy, r: 12 });
    else if (t === 'H') objs.push({ t: 'heart', x, y: cy, r: 12 });
    else if (t === 'O') objs.push({ t: 'sharp', x, y: cy, r: 14 });
    else if (t === 'D') door = { x, y: fy };
  }
  if (!door) door = { x: c.w - 60, y: GT };
}
function customDef(c){
  if (!c._def) c._def = { name: c.name, hint: 'Vytvořil ' + c.author, w: c.w, time: 90, custom: true, author: c.author, build: () => buildFromData(c) };
  return c._def;
}
const allLevels = () => BUILTIN.concat(customLevels.map(customDef));

// ---------- fyzika (hráč i nepřátelé) ----------
function physics(o, dt, stepUp){
  let dx = o.vx * dt, n = Math.ceil(Math.abs(dx) / 3), s = n ? dx / n : 0; o.blocked = false;
  for (let i = 0; i < n; i++){
    if (!hit(o.x + s, o.y, o.w, o.h)) o.x += s;
    else {
      let ok = false;
      if (o.grounded) for (let u = 2; u <= stepUp; u += 2) if (!hit(o.x + s, o.y - u, o.w, o.h)){ o.x += s; o.y -= u; ok = true; break; }
      if (!ok){ o.blocked = true; break; }
    }
  }
  o.vy = Math.min(o.vy + 1800 * dt, 900);
  const dy = o.vy * dt; n = Math.ceil(Math.abs(dy) / 3); s = n ? dy / n : 0; o.grounded = false;
  for (let i = 0; i < n; i++){
    if (!hit(o.x, o.y + s, o.w, o.h)) o.y += s;
    else { if (o.vy > 0) o.grounded = true; o.vy = 0; break; }
  }
}
function stepOnFake(o){
  if (!o.grounded) return;
  const cy = Math.floor((o.y + 1) / C);
  for (const px of [o.x - o.w / 2 + 2, o.x, o.x + o.w / 2 - 2]){
    const cx = Math.floor(px / C); if (cx < 0 || cx >= cols || cy >= ROWS) continue;
    const i = cy * cols + cx;
    if (g[i] === 2 && fg[i]){ const f = fakes[fg[i] - 1]; if (f.t === null){ f.t = 0.3; sfx(180, .25, 'sawtooth'); } }
  }
}

const draftKey = () => 'mazec_draft_' + (user ? user.nick : '');
function loadDraft(){ try{ return JSON.parse(store.get(draftKey())); }catch(e){ return null; } }
function saveDraft(){ if (user && ed) store.set(draftKey(), JSON.stringify({ id: ed.id, name: ed.name, map: ed.map.map(r => r.join('')), objs: ed.objs, created: ed.created })); }
function edPaint(sx, sy){ edPaintRaw(sx, sy); saveDraft(); }
function edPaintRaw(sx, sy){
  const gx = Math.floor((sx + ed.cam) / TILE), gy = Math.floor(sy / TILE);
  if (gx < 0 || gx >= ED_COLS || gy < 2 || gy >= ED_ROWS) return;
  if (isStartCell(gx, gy)){ toast('Tady začíná panáček 🧍 – tohle místo se nemění', 1.5); return; }
  ed.tested = false; const t = ed.tool;
  ed.objs = ed.objs.filter(o => !(o[1] === gx && o[2] === gy));
  if (t === 'X'){ ed.map[gy][gx] = '.'; return; }
  if ('GWF'.includes(t)){ ed.map[gy][gx] = t; return; }
  if (t === 'D') ed.objs = ed.objs.filter(o => o[0] !== 'D');
  ed.map[gy][gx] = '.'; ed.objs.push([t, gx, gy]);
}
function edData(){ return { id: ed.id, name: ed.name, author: user.nick, w: ED_COLS * TILE, map: ed.map.map(r => r.join('')), objs: ed.objs, created: ed.created }; }
function startTest(){
  if (!ed.objs.some(o => o[0] === 'D')){ toast('Přidej dveře 🚪', 2); return; }
  savedHearts = hearts; hearts = 10; mode = 'test'; setMode('test');
  const c = edData(); loadLevelObj({ name: 'Zkouška', hint: 'Dohraj svůj level', w: c.w, time: 120, build: () => buildFromData(c) }, 0);
}
function backToEditor(){ hearts = savedHearts; closePanel(); setMode('edit'); paused = true; }
function trySave(){
  if (!ed.tested){ toast('Nejdřív level dohraj: ▶ Zkusit', 2.5); return; }
  panel('<h1>Název levelu</h1>');
  const p = $('panel'), n = el('input', { placeholder: 'název', maxLength: 24, value: ed.name }, p);
  const row = el('div', { className: 'row' }, p);
  btn(row, 'Uložit', () => { const nm = n.value.trim() || 'Můj level'; ed.name = nm; saveDraft(); saveCustom(); });
  btn(row, 'Zpět', () => { closePanel(); });
  n.onkeydown = e => { if (e.key === 'Enter') { ed.name = n.value.trim() || 'Můj level'; saveCustom(); } };
  n.focus();
}
async function saveCustom(){
  const data = edData(); closePanel();
  const res = await api({ action: 'saveLevel', nick: user.nick, hash: user.hash, level: data });
  if (res === null) data.id = data.id || ('l' + Date.now());
  else if (res.ok) data.id = res.id;
  else { toast('Uložení se nepovedlo, zkus to znovu', 2.5); return; }
  data.created = data.created || Date.now();
  const i = customLevels.findIndex(c => c.id === data.id); if (i >= 0) customLevels[i] = data; else customLevels.push(data);
  cacheLevels(); store.del(draftKey()); ed = null; setMode('menu'); hearts = 10;
  panel('<h1>💾 Uloženo</h1><p>Tvůj level je ve hře.</p>', [{ label: 'OK', fn: () => playLevel(prog.reached) }]);
  refreshLevels();
}
function edScroll(dt){
  const d = (K.ArrowRight || K.KeyD ? 1 : 0) - (K.ArrowLeft || K.KeyA ? 1 : 0);
  if (d) ed.cam = Math.max(0, Math.min(ED_COLS * TILE - VW, ed.cam + d * 700 * dt));
}
function renderEditor(){
  camX = ed.cam; drawBg();
  const c0 = Math.floor(ed.cam / TILE), c1 = Math.min(ED_COLS - 1, c0 + 31), ox = ed.cam;
  for (let gy = 0; gy < ED_ROWS; gy++) for (let gx = c0; gx <= c1; gx++){
    const ch = ed.map[gy][gx]; if (ch === '.') continue;
    ctx.fillStyle = ch === 'G' ? (gy > 0 && ed.map[gy - 1][gx] === '.' ? '#58b947' : '#8d5b2e') : ch === 'W' ? '#9ca7b3' : '#f0a53a';
    ctx.fillRect(gx * TILE - ox, gy * TILE, TILE, TILE);
    ctx.strokeStyle = '#0003'; ctx.strokeRect(gx * TILE - ox + .5, gy * TILE + .5, TILE - 1, TILE - 1);
  }
  ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
  for (let gx = c0; gx <= c1 + 1; gx++){ ctx.beginPath(); ctx.moveTo(gx * TILE - ox + .5, 60); ctx.lineTo(gx * TILE - ox + .5, VH); ctx.stroke(); }
  for (let gy = 2; gy <= ED_ROWS; gy++){ ctx.beginPath(); ctx.moveTo(0, gy * TILE + .5); ctx.lineTo(VW, gy * TILE + .5); ctx.stroke(); }
  ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const IC = { E: '👾', S: '🔺', B: '💣', K: '🔑', H: '❤️', O: '🧽', D: '🚪' };
  for (const [t, gx, gy] of ed.objs) ctx.fillText(IC[t], gx * TILE - ox + TILE / 2, gy * TILE + TILE / 2 + 1);
  ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 2;   // kde začíná hráč (pevné místo)
  ctx.strokeRect(1 * TILE - ox + 1, 11 * TILE + 1, 2 * TILE - 2, 2 * TILE - 2); ctx.restore();
  ctx.fillText('🧍', 60 - ox, 13 * TILE - 14);
  if (cur && mouseIn){                                       // kurzor: ukáže, co se na políčko položí
    const gx = Math.floor((cur.x + ed.cam) / TILE), gy = Math.floor(cur.y / TILE);
    if (gy >= 2 && gy < ED_ROWS && gx >= 0 && gx < ED_COLS){
      const x = gx * TILE - ox, y = gy * TILE, t = ed.tool, locked = isStartCell(gx, gy);
      ctx.globalAlpha = .6;
      if ('GWF'.includes(t)){ ctx.fillStyle = t === 'G' ? '#8d5b2e' : t === 'W' ? '#9ca7b3' : '#f0a53a'; ctx.fillRect(x, y, TILE, TILE); }
      else if (t === 'X'){ ctx.fillStyle = '#e0455a'; ctx.fillRect(x, y, TILE, TILE); }
      else ctx.fillText(IC[t], x + TILE / 2, y + TILE / 2 + 1);
      ctx.globalAlpha = 1; ctx.strokeStyle = locked ? '#ff6b6b' : '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
    }
  }
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

// ---------- zranění, smrt, návrat ----------
function gameOver(){
  paused = true;
  if (mode === 'test') panel('<h1>💔 Došla srdce</h1>', [{ label: '↻ Znovu', fn: () => { hearts = 10; reload(); } }, { label: 'Zpět do editoru', fn: backToEditor, alt: true }]);
  else panel('<h1>💔 Došla srdce</h1>', [{ label: '↻ Zkusit znovu', fn: () => { hearts = 10; reload(); } }]);
}
function levelDone(){
  sfx(660, .15); setTimeout(() => sfx(880, .25), 150);
  if (mode === 'test'){
    ed.tested = true;
    panel('<h1>✅ Dá se dohrát!</h1><p>Teď ho můžeš uložit.</p>', [{ label: 'Zpět do editoru', fn: backToEditor }]); return;
  }
  const all = allLevels(), tm = elapsed, prev = prog.best[lvl], rec = !prev || tm < prev;
  if (rec) prog.best[lvl] = Math.round(tm * 10) / 10;
  prog.reached = Math.max(prog.reached, Math.min(lvl + 1, all.length)); saveProg();
  const fmt = s => s.toFixed(1).replace('.', ',') + ' s';
  const html = '<h1>✅ Level ' + lvl + '</h1><p>⏱ ' + fmt(tm) + '</p><p>🏆 ' + (rec ? (prev ? 'Nový rekord!' : 'Rekord: ' + fmt(tm)) : 'Rekord: ' + fmt(prev)) + '</p>';
  if (lvl >= all.length){
    panel(html + '<p>Prošel jsi všechno! 🎉</p>', [{ label: '↻ Hrát znovu', fn: () => { hearts = 10; loadLevel(1); } }, { label: '✏ Vlastní level', fn: levelsPanel, alt: true }]);
  } else panel(html, [{ label: 'Pokračovat', fn: () => playLevel(lvl + 1) }]);
}
function respawn(){
  P.x = safe.x; P.y = safe.y; P.vx = P.vy = 0; P.leap = 0; P.inv = 2.5;
  const cy0 = Math.floor(P.y / C);
  for (let cy = cy0; cy < cy0 + 3; cy++) for (let cx = Math.floor((P.x - 30) / C); cx <= Math.floor((P.x + 30) / C); cx++)
    if (cx >= 0 && cx < cols && cy < ROWS && !g[cy * cols + cx]) g[cy * cols + cx] = 1;   // opraví podlahu pod tebou
}
function hurt(msg, force){
  if (!force && P.inv > 0) return;
  hearts--; sfx(140, .35, 'sawtooth', .07); toast(msg + '  ❤ ' + hearts, 1.8);
  if (hearts <= 0){ gameOver(); return; }
  respawn();
}
function explode(b){
  const x = b.x, y = b.y - b.r; remove(b); shake = .5; sfx(80, .5, 'sawtooth', .09);
  const rr = 66, cr = Math.ceil(rr / C);
  for (let dy = -cr; dy <= cr; dy++) for (let dx = -cr; dx <= cr; dx++){
    const cx = Math.floor(x / C) + dx, cy = Math.floor(y / C) + dy;
    if (cx < 0 || cx >= cols || cy < 0 || cy >= ROWS) continue;
    const px = (cx + .5) * C, py = (cy + .5) * C;
    if ((px - x) ** 2 + (py - y) ** 2 <= rr * rr){ const i = cy * cols + cx; if (g[i]){ crumb(px, py, cellCol(g[i])); g[i] = 0; fg[i] = 0; } }
  }
  for (let i = 0; i < 40; i++) parts.push({ x, y, vx: (Math.random() - .5) * 400, vy: (Math.random() - .5) * 400, life: .5, col: Math.random() < .5 ? '#ff8a1f' : '#ffd23a', s: 4 });
  for (const o of objs.slice()){ const c = ctr(o); if (o !== b && Math.hypot(c.x - x, c.y - y) < 80 && ((o.t === 'enemy' && !o.boss) || o.t === 'spike')) remove(o); }
  if (Math.hypot(P.x - x, P.y - 24 - y) < 85) hurt('Výbuch!', true);
}

// ---------- objekty ----------
const remove = o => { const i = objs.indexOf(o); if (i >= 0) objs.splice(i, 1); };
function ctr(o){
  if (o.t === 'enemy') return { x: o.x, y: o.y - o.h / 2 };
  if (o.t === 'spike') return { x: o.x, y: o.y - 7 };
  if (o.t === 'bomb') return { x: o.x, y: o.y - o.r };
  return { x: o.x, y: o.y };
}

// ---------- mazání ----------
function objCost(){
  gum = Math.max(0, gum - 10); stroke.n++;
  if (stroke.n >= 2){ gum = Math.min(GUM_MAX, gum + 10); toast('KOMBO! +10 % gumy 🧽', 1.2); sfx(900, .15); }
}
function stamp(wx, wy){
  if (gum <= 0){ if (gumWarn <= 0){ toast('Došla guma! Najdi ořezávátko 🧽', 2); gumWarn = 3; } return; }
  const cr = Math.ceil(R / C), cx0 = Math.floor(wx / C), cy0 = Math.floor(wy / C); let n = 0;
  for (let dy = -cr; dy <= cr; dy++) for (let dx = -cr; dx <= cr; dx++){
    const cx = cx0 + dx, cy = cy0 + dy;
    if (cx < 0 || cx >= cols || cy < 0 || cy >= ROWS) continue;
    const i = cy * cols + cx; if (!g[i]) continue;
    const px = (cx + .5) * C, py = (cy + .5) * C;
    if ((px - wx) ** 2 + (py - wy) ** 2 <= R * R){ if (Math.random() < .25) crumb(px, py, cellCol(g[i])); g[i] = 0; fg[i] = 0; n++; }
  }
  if (n && Math.random() < .25) sfx(300 + Math.random() * 200, .05, 'triangle', .02);
  gum = Math.max(0, gum - n * COST);
  for (const o of objs.slice()){
    if (o.boss) continue;
    const c = ctr(o);
    if (o.t === 'bomb'){
      for (let i = 0; i < 9; i++){
        const sx = o.x + ((i % 3) - 1) * o.r * .8, sy = c.y + (((i / 3) | 0) - 1) * o.r * .8;
        if ((sx - wx) ** 2 + (sy - wy) ** 2 <= R * R) o.cov.add(i);
      }
      if (o.cov.size >= 9){ remove(o); objCost(); sfx(500, .1); toast('Bomba zneškodněna 💣', 1); }
    } else if (Math.hypot(c.x - wx, c.y - wy) < R + o.r){
      if (o.t === 'enemy' || o.t === 'spike'){ remove(o); objCost(); sfx(420, .1, 'triangle'); for (let k = 0; k < 10; k++) crumb(c.x, c.y, '#e0455a'); }
      else if (o.t === 'key'){ remove(o); toast('Smazal jsi klíč! 😱', 1.5); sfx(110, .3, 'sawtooth'); }
      else { remove(o); toast('Smazal jsi to…', 1); }
    }
  }
}
function endStroke(){
  for (const o of objs.slice()) if (o.t === 'bomb' && o.cov.size > 0) explode(o);   // napůl smazaná bomba vybuchne
  stroke = { n: 0 };
}

// ---------- vstup ----------
const K = {}; let jumpReq = false, leapReq = false, joyX = 0;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.code)) e.preventDefault();
  if (e.repeat) return; K[e.code] = true;
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpReq = true;
  if (e.code === 'Enter') leapReq = true;
});
addEventListener('keyup', e => K[e.code] = false);

let down = false, cur = { x: 0, y: 0 }, prev = { x: 0, y: 0 }, mouseIn = false, touchBrush = false;
const toGame = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; };
cv.addEventListener('pointerdown', e => {
  if (mode === 'edit'){ cv.setPointerCapture(e.pointerId); cur = toGame(e); edDown = true; edPaint(cur.x, cur.y); return; }
  if (paused || (e.pointerType === 'mouse' && e.button !== 0)) return;
  cv.setPointerCapture(e.pointerId); cur = toGame(e); prev = { ...cur }; down = true; touchBrush = e.pointerType !== 'mouse'; stroke = { n: 0 };
  audio();
});
cv.addEventListener('pointermove', e => { cur = toGame(e); mouseIn = true; if (edDown && mode === 'edit') edPaint(cur.x, cur.y); });
cv.addEventListener('pointerleave', () => mouseIn = false);
const up = () => { edDown = false; if (down){ down = false; endStroke(); } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerdown', e => { const m = $('menu'); if (m.style.display === 'flex' && !m.contains(e.target) && e.target !== $('menuBtn')) closeMenu(); });

// dotykové ovládání
(() => {
  const joy = $('joy'), knob = $('knob'); let jid = null;
  const setJ = e => { const r = joy.getBoundingClientRect(); let v = ((e.clientX - r.left) / r.width - .5) * 2.2;
    v = Math.max(-1, Math.min(1, v)); joyX = Math.abs(v) < .25 ? 0 : Math.sign(v);
    knob.style.left = (50 + v * 35) + '%'; };
  joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); setJ(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) setJ(e); });
  const rel = e => { if (e.pointerId === jid){ jid = null; joyX = 0; knob.style.left = '50%'; } };
  joy.addEventListener('pointerup', rel); joy.addEventListener('pointercancel', rel);
  $('bJump').addEventListener('pointerdown', () => jumpReq = true);
  $('bLeap').addEventListener('pointerdown', () => leapReq = true);
})();

// ---------- hlavní aktualizace ----------
function update(dt){
  T += dt; gumWarn -= dt; shake = Math.max(0, shake - dt);
  timeLeft -= dt; elapsed += dt;
  if (timeLeft <= 0){
    hearts--; sfx(140, .4, 'sawtooth', .07);
    if (hearts <= 0){ gameOver(); return; }
    toast('⏱ Čas vypršel! Level znovu  ❤ ' + hearts, 2.5); reload(); return;
  }

  // ovládání hráče
  const ax = (K.ArrowRight || K.KeyD ? 1 : 0) - (K.ArrowLeft || K.KeyA ? 1 : 0) || joyX;
  if (ax) P.face = ax > 0 ? 1 : -1;
  P.inv = Math.max(0, P.inv - dt);
  if (jumpReq) P.buf = .12; if (leapReq) P.bufL = .12; jumpReq = leapReq = false;
  P.buf -= dt; P.bufL -= dt; P.coy = P.grounded ? .1 : P.coy - dt;
  if (P.buf > 0 && P.coy > 0){ P.vy = -640; P.buf = 0; P.coy = 0; P.leap = 0; sfx(520, .1, 'square', .03); }
  else if (P.bufL > 0 && P.coy > 0){ P.vy = -520; P.bufL = 0; P.coy = 0; P.leap = 1; P.leapDir = P.face; P.leapT = 0; sfx(420, .15, 'square', .03); }
  if (P.leap){ P.vx = P.leapDir * 340; P.leapT += dt; if (P.grounded && P.leapT > .1) P.leap = 0; }
  else P.vx = ax * 200;
  physics(P, dt, 8);
  if (P.blocked) P.leap = 0;
  stepOnFake(P);
  if (P.y > VH + 60) hurt('Spadl jsi do prázdna!', true);

  // bezpečné místo pro návrat
  safeT -= dt;
  if (P.grounded && safeT <= 0){
    const cy = Math.floor((P.y + 1) / C); let ok = true;
    for (const px of [P.x - 9, P.x, P.x + 9]){ const t = cell(Math.floor(px / C), cy); if (t !== 1 && t !== 3) ok = false; }
    for (const o of objs) if ((o.t === 'enemy' && Math.abs(o.x - P.x) < 300) || ((o.t === 'spike' || o.t === 'bomb') && Math.abs(o.x - P.x) < 70)) ok = false;
    if (ok){ safe = { x: P.x, y: P.y }; safeT = .25; }
  }

  // kouzlení nepřátel zpoza rohu
  for (const s of spawns.slice()) if (P.x > s.trig){ objs.push(s.e); spawns.splice(spawns.indexOf(s), 1);
    for (let k = 0; k < 14; k++) parts.push({ x: s.e.x, y: s.e.y - 14, vx: (Math.random() - .5) * 200, vy: (Math.random() - .5) * 200, life: .5, col: '#fff', s: 3 }); }

  // objekty
  for (const o of objs.slice()){
    if (o.t === 'enemy'){
      const d = P.x - o.x;
      if (Math.abs(d) < o.aggro){ o.vx = Math.sign(d) * o.sp; o.face = Math.sign(d) || 1; } else o.vx = 0;
      if (o.boss){
        o.leapT -= dt;
        if (o.leapT <= 0 && o.grounded && Math.abs(d) < 300){ o.vy = -520; o.leap = true; o.leapDir = Math.sign(d) || 1; o.leapT = 2.8; sfx(90, .2, 'sawtooth', .06); }
        if (o.leap){ o.vx = o.leapDir * 210; if (o.grounded && o.leapT < 2.6){ o.leap = false; shake = .25; sfx(70, .25, 'sawtooth', .07); } }
      }
      physics(o, dt, 12); stepOnFake(o);
      if (o.y > VH + 80){
        remove(o);
        if (o.boss){ toast('Boss padl! 🎉', 3); sfx(880, .4, 'triangle', .06); for (let k = 0; k < 60; k++) parts.push({ x: o.x, y: 200, vx: (Math.random() - .5) * 500, vy: -Math.random() * 400, life: 1.2, col: ['#ffd23a', '#f2638f', '#2f7bf5', '#2fb86b'][k % 4], s: 5 }); }
        continue;
      }
      if (Math.abs(P.x - o.x) < (P.w + o.w) / 2 - 2 && P.y - P.h < o.y && P.y > o.y - o.h) hurt(o.boss ? 'Boss tě chytil!' : 'Chytl tě nepřítel!');
    } else if (o.t === 'spike' || o.t === 'bomb'){
      if (cell(Math.floor(o.x / C), Math.floor((o.y + 1) / C)) === 0){ o.vy += 1500 * dt; o.y += o.vy * dt; if (o.y > VH + 60) remove(o); } else o.vy = 0;
      if (o.t === 'spike' && Math.abs(P.x - o.x) < P.w / 2 + 8 && P.y > o.y - 12 && P.y - P.h < o.y) hurt('Píchl ses o hroty!');
    } else {
      if (Math.hypot(P.x - o.x, P.y - 24 - o.y) < 26){
        if (o.t === 'key'){ keys++; remove(o); sfx(900, .1, 'triangle', .05); toast('🔑 Klíč ' + keys + '/5', 1); }
        else if (o.t === 'heart'){ hearts = Math.min(15, hearts + 1); remove(o); sfx(700, .2, 'triangle', .05); toast('❤️ Srdce navíc!', 1.2); }
        else if (o.t === 'sharp'){ gum = Math.min(GUM_MAX, gum + 30); remove(o); sfx(600, .2, 'triangle', .05); toast('Ořezávátko! +30 % gumy 🧽', 1.5); }
      }
    }
  }

  // mizení falešné podlahy
  for (const f of fakes) if (f.t !== null){
    f.t -= dt;
    if (f.t <= 0){ for (const i of f.cells) if (g[i] === 2){ crumb((i % cols + .5) * C, (Math.floor(i / cols) + .5) * C, '#f0a53a'); g[i] = 0; fg[i] = 0; } f.t = null; f.done = true; }
  }

  // dveře
  doorCD -= dt;
  const atDoor = d => d && Math.abs(P.x - d.x) < 26 && Math.abs(P.y - (d.y || GT)) < 50;
  if (!bonus && doorCD <= 0 && atDoor(door)){
    if (keys >= 5) levelDone();
    else { doorCD = 99; panel('<h1>🚪 Zamčeno</h1><p>Máš jen ' + keys + ' z 5 klíčů.</p>',
      [{ label: 'Hrát dále a získat klíče', fn: () => { bonus = true; doorCD = 0; paused = false; timeLeft += 25;
        toast('Dveře zmizely! Jdi dál – za nimi jsou další klíče (+25 s)', 3.5); } }]); }
  }
  if (bonus && atDoor(door2)){
    if (keys >= 5) levelDone();
    else { paused = true; panel('<h1>🚪 Poslední dveře</h1><p>Máš jen ' + keys + ' z 5 klíčů.</p>',
      [{ label: '↻ Hrát znovu tento level', fn: reload }]); }
  }

  // guma (držím a táhnu)
  if (down){
    const dist = Math.hypot(cur.x - prev.x, cur.y - prev.y), n = Math.max(1, Math.ceil(dist / (R * .5)));
    for (let s = 1; s <= n; s++) stamp(prev.x + (cur.x - prev.x) * s / n + camX, prev.y + (cur.y - prev.y) * s / n);
    prev = { ...cur };
  }

  // částice
  for (const p of parts){ p.life -= dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);

  // kamera
  const tx = Math.max(0, Math.min(W - VW, P.x - VW * .4)); camX += (tx - camX) * .15;
}

// ---------- kreslení ----------
function drawBg(){
  const gr = ctx.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, '#8cc4f4'); gr.addColorStop(1, '#d6edff');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 6; i++){ const x = ((i * 330 - camX * .15) % 1980 + 1980) % 1980 - 150, y = 50 + (i * 37) % 90;
    ctx.beginPath(); ctx.ellipse(x, y, 60, 18, 0, 0, 7); ctx.ellipse(x + 35, y - 10, 40, 16, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#4d9a3d'; for (let i = -1; i < 4; i++){ const x = i * 520 - (camX * .3 % 520); ctx.beginPath(); ctx.ellipse(x + 260, 420, 330, 190, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#5db84a'; for (let i = -1; i < 4; i++){ const x = i * 420 - (camX * .5 % 420); ctx.beginPath(); ctx.ellipse(x + 210, 440, 260, 110, 0, 0, 7); ctx.fill(); }
}
function drawTerrain(){
  const cx0 = Math.max(0, Math.floor(camX / C)), cx1 = Math.min(cols - 1, Math.ceil((camX + VW) / C)), ox = Math.round(camX);
  for (let cy = 0; cy < ROWS; cy++) for (let cx = cx0; cx <= cx1; cx++){
    const i = cy * cols + cx, t = g[i]; if (!t) continue;
    let col;
    if (t === 1) col = cell(cx, cy - 1) === 0 ? '#58b947' : ['#8d5b2e', '#82522a', '#96622f'][(cx * 7 + cy * 3) % 3];
    else if (t === 3) col = (cy % 5 === 0 || (cx + ((cy / 5 | 0) % 2) * 5) % 10 === 0) ? '#6f7a86' : ((cx + cy) % 3 ? '#9ca7b3' : '#8e99a6');
    else { const f = fakes[fg[i] - 1]; col = f && f.t !== null && Math.floor(T * 20) % 2 ? '#fff0b8' : ((cx + (cy >> 1)) % 4 < 2 ? '#f0a53a' : '#df8a22'); }
    ctx.fillStyle = col; ctx.fillRect(cx * C - ox, cy * C, C, C);
    if (cell(cx, cy + 1) === 0 && cy < ROWS - 1){ ctx.fillStyle = '#0003'; ctx.fillRect(cx * C - ox, cy * C + C - 2, C, 2); }
  }
}
function outline(c = ctx){ c.lineWidth = 2.5; c.strokeStyle = '#14183a'; c.lineJoin = 'round'; }
function drawObj(o){
  const x = Math.round(o.x - camX);
  ctx.save(); outline();
  if (o.t === 'spike'){
    ctx.translate(x, o.y); ctx.fillStyle = '#cfd4de';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-5, -15); ctx.lineTo(0, 0); ctx.lineTo(5, -15); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (o.t === 'bomb'){
    const sh = o.cov.size ? Math.sin(T * 60) * 1.5 : 0; ctx.translate(x + sh, o.y - 14);
    ctx.fillStyle = o.cov.size && Math.floor(T * 12) % 2 ? '#c62828' : '#2b2b33';
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -13); ctx.quadraticCurveTo(10, -22, 16, -20); ctx.stroke();
    ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.arc(16, -20, 3 + Math.sin(T * 20), 0, 7); ctx.fill();
    ctx.fillStyle = '#fff6'; ctx.beginPath(); ctx.arc(-5, -5, 3, 0, 7); ctx.fill();
  } else if (o.t === 'key'){
    ctx.translate(x, o.y + Math.sin(T * 3 + o.x) * 3); ctx.fillStyle = '#ffcc1f';
    ctx.beginPath(); ctx.arc(-6, -4, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillRect(-1, -6, 14, 5); ctx.strokeRect(-1, -6, 14, 5); ctx.fillRect(8, -1, 3, 6); ctx.strokeRect(8, -1, 3, 6);
    ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc(-6, -4, 2, 0, 7); ctx.fill();
  } else if (o.t === 'heart'){
    ctx.translate(x, o.y + Math.sin(T * 3 + o.x) * 3); ctx.fillStyle = '#ee3355'; ctx.scale(1 + Math.sin(T * 6) * .06, 1 + Math.sin(T * 6) * .06);
    ctx.beginPath(); ctx.moveTo(0, 10); ctx.bezierCurveTo(-18, -2, -10, -16, 0, -6); ctx.bezierCurveTo(10, -16, 18, -2, 0, 10); ctx.fill(); ctx.stroke();
  } else if (o.t === 'sharp'){
    ctx.translate(x, o.y + Math.sin(T * 3 + o.x) * 3); ctx.rotate(-.2);
    ctx.fillStyle = '#ff8fb3'; ctx.fillRect(-14, -9, 28, 18); ctx.strokeRect(-14, -9, 28, 18);
    ctx.fillStyle = '#fff'; ctx.fillRect(-14, -9, 9, 18); ctx.strokeRect(-14, -9, 9, 18);
    ctx.font = 'bold 8px sans-serif'; ctx.fillStyle = '#14183a'; ctx.fillText('+30', -3, 3);
  } else if (o.t === 'enemy' && o.boss){
    ctx.translate(x, o.y); const sq = Math.sin(T * 6) * 2;
    ctx.fillStyle = '#7b3fc4'; ctx.beginPath(); ctx.ellipse(0, -45, 40, 45 - sq, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.moveTo(-22, -84); ctx.lineTo(-22, -100); ctx.lineTo(-11, -90); ctx.lineTo(0, -104); ctx.lineTo(11, -90); ctx.lineTo(22, -100); ctx.lineTo(22, -84); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; for (const ex of [-15, 15]){ ctx.beginPath(); ctx.arc(ex, -55, 11, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#14183a'; for (const ex of [-15, 15]){ ctx.beginPath(); ctx.arc(ex + o.face * 4, -53, 5, 0, 7); ctx.fill(); }
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-28, -72); ctx.lineTo(-6, -64); ctx.moveTo(28, -72); ctx.lineTo(6, -64); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-18, -26); ctx.lineTo(18, -26); ctx.lineTo(10, -14); ctx.lineTo(0, -22); ctx.lineTo(-10, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (o.t === 'enemy'){
    ctx.translate(x, o.y); const sq = Math.sin(T * 10 + o.x) * 1.5;
    ctx.fillStyle = '#e0455a'; ctx.beginPath(); ctx.ellipse(0, -13 + sq / 2, 15, 13 - sq, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; for (const ex of [-6, 6]){ ctx.beginPath(); ctx.arc(ex, -16, 4.5, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#14183a'; for (const ex of [-6, 6]){ ctx.beginPath(); ctx.arc(ex + o.face * 1.5, -15, 2, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(-11, -24); ctx.lineTo(-2, -20); ctx.moveTo(11, -24); ctx.lineTo(2, -20); ctx.stroke();
  }
  ctx.restore();
}
function drawDoor(dr){
  const x = Math.round(dr.x - camX), open = keys >= 5;
  ctx.save(); outline(); ctx.translate(x, dr.y || GT);
  ctx.fillStyle = open ? '#3ecf6b' : '#8a5a2b'; ctx.fillRect(-20, -72, 40, 72); ctx.strokeRect(-20, -72, 40, 72);
  ctx.fillStyle = open ? '#d9ffe6' : '#a56a33'; ctx.fillRect(-14, -66, 28, 60);
  ctx.fillStyle = '#ffcc1f'; ctx.beginPath(); ctx.arc(9, -34, 3.5, 0, 7); ctx.fill();
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  const t = '🔑 ' + keys + '/5'; ctx.strokeText(t, 0, -80); ctx.fillText(t, 0, -80);
  ctx.restore();
}
// postavička (c = kreslicí plátno, počátek = chodidla)
function drawChar(c, face, t, moving, air, col){
  c.save(); c.scale(face, 1); outline(c);
  const wlk = moving ? Math.sin(t * 14) * 5 : 0;
  c.fillStyle = col.pants || '#20304f';
  c.fillRect(-9 + (air ? -3 : wlk), -16, 8, 12); c.strokeRect(-9 + (air ? -3 : wlk), -16, 8, 12);
  c.fillRect(1 + (air ? 3 : -wlk), -16, 8, 12); c.strokeRect(1 + (air ? 3 : -wlk), -16, 8, 12);
  c.fillStyle = '#111';
  c.fillRect(-11 + (air ? -3 : wlk), -5, 12, 5); c.strokeRect(-11 + (air ? -3 : wlk), -5, 12, 5);
  c.fillRect(1 + (air ? 3 : -wlk), -5, 12, 5); c.strokeRect(1 + (air ? 3 : -wlk), -5, 12, 5);
  c.fillStyle = col.shirt; c.beginPath(); c.roundRect(-12, -36, 24, 24, 5); c.fill(); c.stroke();
  const wave = Math.sin(t * 8) * 4;
  const arm = (sx, ex, ey) => { c.beginPath(); c.moveTo(sx, -32); c.lineTo(ex, ey); c.lineWidth = 8; c.strokeStyle = '#14183a'; c.stroke();
    c.lineWidth = 4.5; c.strokeStyle = col.shirt; c.stroke(); outline(c); c.fillStyle = col.skin; c.beginPath(); c.arc(ex, ey, 4.5, 0, 7); c.fill(); c.stroke(); };
  if (!moving && !air) arm(12, 16 + wave, -50); else arm(12, 16 + (air ? 4 : -wlk), air ? -48 : -20);
  arm(-12, -15 + (moving ? wlk : 0), air ? -46 : -18);
  c.fillStyle = col.skin; c.beginPath(); c.arc(0, -44, 11, 0, 7); c.fill(); c.stroke();
  c.fillStyle = col.hair; c.beginPath(); c.arc(0, -44, 11.5, Math.PI * 1.02, Math.PI * 1.98); c.lineTo(8, -50); c.lineTo(-9, -48); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#14183a'; c.beginPath(); c.arc(-2, -44, 1.6, 0, 7); c.arc(5, -44, 1.6, 0, 7); c.fill();
  c.lineWidth = 1.8; c.beginPath(); c.arc(2, -42, 4.5, .2, Math.PI - .2); c.stroke();
  if (col.hat){                                              // čepice
    outline(c); c.fillStyle = col.hat;
    c.beginPath(); c.arc(0, -46, 12, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.roundRect(2, -49, 16, 4.5, 2); c.fill(); c.stroke();
  }
  c.restore();
}
function drawPlayer(){
  if (P.inv > 0 && Math.floor(P.inv * 12) % 2) return;
  ctx.save(); ctx.translate(Math.round(P.x - camX), Math.round(P.y));
  drawChar(ctx, P.face, T, P.grounded && Math.abs(P.vx) > 1, !P.grounded, prog.char); ctx.restore();
}
function render(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 20, (Math.random() - .5) * shake * 20);
  drawBg(); drawTerrain();
  if (door && !bonus) drawDoor(door);
  if (door2) drawDoor(door2);
  objs.forEach(drawObj); drawPlayer();
  for (const p of parts){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - camX, p.y, p.s, p.s); } ctx.globalAlpha = 1;
  if (!paused && ((mouseIn && !touchBrush) || down)){
    ctx.beginPath(); ctx.arc(cur.x, cur.y, R, 0, 7); ctx.fillStyle = down ? 'rgba(255,150,190,.55)' : 'rgba(255,150,190,.25)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  ctx.restore();
}
function hud(){
  $('hearts').textContent = '❤️'.repeat(Math.min(hearts, 15)) + ' ' + hearts;
  $('lvl').textContent = mode === 'test' ? 'Zkouška' : 'Level ' + lvl;
  const tl = Math.max(0, Math.ceil(timeLeft)); const te = $('time'); te.textContent = '⏱ ' + tl; te.style.color = tl <= 10 ? '#ff7070' : '#fff';
  $('keysH').textContent = '🔑 ' + keys + ' / 5';
  $('gumfill').style.width = (gum / GUM_MAX * 100) + '%'; $('gumtxt').textContent = Math.round(gum) + ' %';
}

// ---------- smyčka ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (mode === 'edit' && ed){ edScroll(dt); renderEditor(); }
  else {
    if (!paused && g) update(dt);
    if (g){ render(); if (P) hud(); } else drawBg();
  }
  requestAnimationFrame(loop);
}
fit(); startPanel(); silentLogin(); requestAnimationFrame(loop);
</script>
