<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAZEC – hra o mazání světa</title>
<style>
  html,body{margin:0;height:100%;background:#10131c;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;
            display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:relative;width:min(100vw,200vh);aspect-ratio:2/1;background:#000;overflow:hidden;--u:1px}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:none;touch-action:none}
  #hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;
       padding:calc(8*var(--u)) calc(12*var(--u));color:#fff;font-weight:700;font-size:calc(17*var(--u));
       text-shadow:0 2px 3px #000a;pointer-events:none}
  #hud .mid{text-align:center}
  #time{font-size:calc(26*var(--u))}
  #gumrow{position:absolute;left:calc(12*var(--u));top:calc(40*var(--u));display:flex;align-items:center;gap:calc(8*var(--u));
          color:#fff;font-weight:700;font-size:calc(15*var(--u));text-shadow:0 2px 3px #000a;pointer-events:none}
  #gumbar{width:calc(180*var(--u));height:calc(14*var(--u));background:#0006;border:2px solid #fff9;border-radius:99px;overflow:hidden}
  #gumfill{display:block;height:100%;background:linear-gradient(#ff9ec0,#f2638f);width:100%}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);padding:calc(8*var(--u)) calc(20*var(--u));
         background:#000a;color:#fff;border-radius:calc(12*var(--u));font-size:calc(22*var(--u));font-weight:700;
         text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #panel{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
         background:rgba(10,14,30,.82);color:#fff;text-align:center;padding:calc(20*var(--u));box-sizing:border-box}
  #panel h1{font-size:calc(52*var(--u));margin:0 0 calc(8*var(--u));letter-spacing:2px}
  #panel p{font-size:calc(18*var(--u));line-height:1.5;margin:calc(4*var(--u)) 0;max-width:calc(760*var(--u))}
  .btn{background:#f2638f;color:#fff;border:0;border-radius:calc(14*var(--u));padding:calc(12*var(--u)) calc(28*var(--u));
       font-size:calc(22*var(--u));font-weight:700;cursor:pointer;margin:calc(8*var(--u));box-shadow:0 4px 0 #a73a60}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a73a60}
  .lv{display:inline-block;width:calc(40*var(--u));height:calc(40*var(--u));line-height:calc(40*var(--u));margin:calc(3*var(--u));
      border-radius:50%;background:#2f7bf5;color:#fff;font-weight:700;cursor:pointer;font-size:calc(18*var(--u))}
  #touch{display:none}
  .touch #touch{display:block}
  #joy{position:absolute;left:calc(20*var(--u));bottom:calc(20*var(--u));width:calc(150*var(--u));height:calc(110*var(--u));
       border-radius:calc(60*var(--u));background:#ffffff22;border:2px solid #fff6;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:calc(54*var(--u));height:calc(54*var(--u));margin:calc(-27*var(--u));
        border-radius:50%;background:#fffa;pointer-events:none}
  .tb{position:absolute;bottom:calc(24*var(--u));width:calc(84*var(--u));height:calc(84*var(--u));border-radius:50%;
      background:#2f7bf5cc;border:3px solid #fff;color:#fff;font-size:calc(40*var(--u));text-align:center;
      line-height:calc(80*var(--u));font-weight:700;touch-action:none}
  #bJump{right:calc(20*var(--u))} #bLeap{right:calc(120*var(--u));background:#f29a2fcc}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="450"></canvas>
  <div id="hud">
    <div id="hearts"></div>
    <div class="mid"><div id="lvl"></div><div id="time"></div></div>
    <div id="keysH"></div>
  </div>
  <div id="gumrow"><span>🧽</span><div id="gumbar"><i id="gumfill"></i></div><span id="gumtxt"></span></div>
  <div id="toast"></div>
  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div class="tb" id="bLeap">⤴</div>
    <div class="tb" id="bJump">↑</div>
  </div>
  <div id="panel"></div>
</div>

<script>
// =====================================================================
//  MAZEC – hra o mazání světa
// =====================================================================
const VW = 900, VH = 450, C = 6, ROWS = VH / C, GT = 390;       // GT = výška podlahy
const R = 20, COST = 0.07, GUM_MAX = 500;                        // R = velikost gumy
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), wrap = $('wrap');

function fit(){ wrap.style.setProperty('--u', (wrap.clientWidth / VW) + 'px'); }
addEventListener('resize', fit); fit();
if (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');

// ---------- zvuky (jednoduché pípání) ----------
let ac;
function sfx(f, d = .1, type = 'square', v = .04){
  try{ ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); }catch(e){}
}

// ---------- stav hry ----------
let W, cols, g, fg, fakes, objs, spawns, parts, door, door2, bonus = false;
let lvl = 1, hearts = 10, gum, keys, timeLeft, T = 0, camX = 0, shake = 0;
let P, safe, safeT, doorCD = 0, paused = true, gumWarn = 0;
let stroke = { n: 0 };

// ---------- mapa (mřížka buněk) ----------
function cell(cx, cy){ if (cx < 0 || cx >= cols) return 1; if (cy < 0 || cy >= ROWS) return 0; return g[cy * cols + cx]; }
function hit(x, y, w, h){
  const x0 = Math.floor((x - w / 2) / C), x1 = Math.floor((x + w / 2 - .01) / C);
  const y0 = Math.floor((y - h) / C),     y1 = Math.floor((y - .01) / C);
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (cell(cx, cy)) return true;
  return false;
}
function fill(x, y, w, h, type, fid = 0){
  const x0 = Math.floor(x / C), x1 = Math.ceil((x + w) / C) - 1, y0 = Math.floor(y / C), y1 = Math.ceil((y + h) / C) - 1;
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++){
    if (cx < 0 || cx >= cols || cy < 0 || cy >= ROWS) continue;
    const i = cy * cols + cx; g[i] = type; fg[i] = fid; if (fid) fakes[fid - 1].cells.push(i);
  }
}
const clearR = (x, y, w, h) => fill(x, y, w, h, 0);

// ---------- stavebnice levelů ----------
const mkEnemy = (x, y, sp, aggro) => ({ t: 'enemy', x, y, vx: 0, vy: 0, w: 26, h: 28, sp, aggro, face: 1, grounded: false, r: 16 });
const B = {
  ground: (a, b) => fill(a, GT, b - a, 60, 1),
  pit:    (a, b) => clearR(a, GT, b - a, 60),
  wall:   (x, w = 30, t = 0, b = GT) => fill(x, t, w, b - t, 3),
  block:  (x, y, w, h) => fill(x, y, w, h, 1),
  fake:   (x, w) => { clearR(x, GT, w, 60); fakes.push({ cells: [], t: null }); fill(x, GT, w, 60, 2, fakes.length); },
  enemy:  (x, sp = 70, aggro = 600, y = GT) => objs.push(mkEnemy(x, y, sp, aggro)),
  ambush: (trig, x, sp = 100, aggro = 3000, y = GT) => spawns.push({ trig, e: mkEnemy(x, y, sp, aggro) }),
  spikes: (x, n) => { for (let i = 0; i < n; i++) objs.push({ t: 'spike', x: x + i * 20 + 10, y: GT, r: 10, vy: 0 }); },
  bomb:   x => objs.push({ t: 'bomb', x, y: GT, r: 14, cov: new Set(), vy: 0 }),
  key:    (x, y = GT - 40) => objs.push({ t: 'key', x, y, r: 12 }),
  heart:  (x, y = GT - 40) => objs.push({ t: 'heart', x, y, r: 12 }),
  sharp:  x => objs.push({ t: 'sharp', x, y: GT - 30, r: 14 }),
  door:   x => { door = { x }; }
};

const LEVELS = [
 { name: 'Level 1 – Zeď', hint: 'Podrž myš a přejeď přes zeď – vymaž v ní průchod!', w: 2000, time: 60, build(){
    B.ground(0, 2000); B.wall(600); B.wall(1100); B.wall(1500);
    [250, 450, 850, 1300, 1750, 1820].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1000, 330); B.door(1900); } },

 { name: 'Level 2 – Podlaha', hint: 'Nepřítel jde po tobě – vymaž podlahu pod ním!', w: 2200, time: 60, build(){
    B.ground(0, 2200); B.pit(1100, 1200); B.wall(1700);
    B.enemy(800, 70, 500); B.enemy(1450, 75, 500); B.enemy(1950, 80, 500);
    [300, 600, 1000, 1300, 1650, 2050].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1250, 330); B.sharp(1800); B.door(2120); } },

 { name: 'Level 3 – Utíkej a maž!', hint: 'Někdo ti jde v patách. Maž zdi za běhu!', w: 2400, time: 60, build(){
    B.ground(0, 2400); B.wall(700); B.wall(1200); B.wall(1700);
    B.ambush(500, 100, 125); B.enemy(1950, 90, 500);
    [350, 600, 1000, 1400, 1850, 2150].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1300, 330); B.sharp(950); B.sharp(1900); B.door(2320); } },

 { name: 'Level 4 – Pasti', hint: 'Pasti vymaž dřív, než na ně šlápneš. Nebo je přeskoč (Enter = dlouhý skok).', w: 2400, time: 65, build(){
    B.ground(0, 2400); B.spikes(500, 3); B.spikes(800, 6); B.wall(1100); B.spikes(1250, 10);
    B.spikes(1700, 4); B.enemy(1900, 80, 500); B.pit(2050, 2120);
    [300, 650, 1000, 1450, 1900, 2250].forEach((x, i) => B.key(x, i % 2 ? 330 : 350));
    B.heart(1000, 330); B.sharp(1200); B.door(2330); } },

 { name: 'Level 5 – Bludiště', hint: 'Dole nebo nahoře? Zvol rychle cestu! Schody jsou u začátku.', w: 2650, time: 80, build(){
    B.ground(0, 2650);
    for (let i = 0; i < 4; i++) fill(200 + i * 40, GT - (i + 1) * 40, 40, (i + 1) * 40, 1);
    fill(360, 230, 2090, 20, 1); clearR(1000, 230, 80, 20); clearR(1800, 230, 80, 20);
    B.wall(700, 30, 250); B.wall(1300, 30, 250); B.wall(2000, 30, 250);
    B.wall(900, 30, 0, 230); B.wall(1700, 30, 0, 230);
    B.enemy(1500, 70, 300); B.ambush(1650, 2100, 90, 800, 230);
    [[500, 350], [1150, 350], [1650, 350], [600, 190], [1300, 190], [2100, 190], [2350, 190]].forEach(k => B.key(k[0], k[1]));
    B.heart(1150, 300); B.sharp(2250); B.door(2540); } },

 { name: 'Level 6 – Bomby', hint: 'Bombu vymaž CELOU jedním tahem. Jen napůl = bum!', w: 2300, time: 70, build(){
    B.ground(0, 2300); B.wall(600); B.bomb(560); B.wall(1100); B.bomb(1160);
    B.enemy(1450, 75, 500); B.bomb(1500); B.pit(1800, 1880); B.bomb(1700); B.spikes(1950, 3);
    [300, 500, 900, 1300, 1900, 2100].forEach((x, i) => B.key(x, i % 2 ? 330 : 350));
    B.heart(1000, 330); B.sharp(1350); B.door(2220); } },

 { name: 'Level 7 – Falešná podlaha', hint: 'Oranžová podlaha po šlápnutí zmizí! Přeskoč ji (mezerník, nebo Enter = dlouhý skok).', w: 2400, time: 70, build(){
    B.ground(0, 2400); B.fake(500, 120); B.fake(900, 100); B.fake(1300, 160); B.fake(1700, 100); B.wall(2000);
    B.enemy(1050, 80, 500); B.enemy(2200, 85, 500);
    [300, 560, 950, 1380, 1760, 2150].forEach((x, i) => B.key(x, i % 2 ? 350 : 335));
    B.heart(1350, 320); B.sharp(1500); B.door(2330); } },

 { name: 'Level 8 – Časovka', hint: 'Jen 40 vteřin! Rychle mazej a běž!', w: 2200, time: 40, build(){
    B.ground(0, 2200); [400, 750, 1100, 1450, 1800].forEach(x => B.wall(x, 24));
    B.ambush(600, 100, 115); B.enemy(1300, 80, 500);
    [250, 550, 900, 1250, 1650, 2000].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1000, 330); B.sharp(1500); B.door(2120); } },

 { name: 'Level 9 – Kombo', hint: 'Vymaž víc věcí jedním tahem a dostaneš gumu zpět (kombo)!', w: 2400, time: 75, gum: 250, build(){
    B.ground(0, 2400); B.spikes(700, 3); B.enemy(790, 70, 200); B.wall(1050, 36);
    B.spikes(1300, 5); B.enemy(1400, 70, 200); B.wall(1600, 36);
    B.bomb(1880); B.spikes(1920, 2); B.enemy(2000, 75, 200);
    [300, 600, 950, 1450, 1800, 2200].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1000, 330); B.sharp(1000); B.sharp(1650); B.door(2330); } },

 { name: 'Level 10 – Finále', hint: 'Všechny triky dohromady. Hodně štěstí!', w: 3200, time: 100, build(){
    B.ground(0, 3200); B.wall(500); B.spikes(700, 4); B.fake(900, 110); B.enemy(1100, 80, 450);
    B.wall(1350); B.bomb(1310); B.pit(1500, 1590); B.fake(1650, 120); B.ambush(1750, 1400, 140);
    B.wall(2000); B.spikes(2150, 8); B.bomb(2400); B.fake(2500, 150); B.wall(2800); B.ambush(2550, 3000, 90, 900);
    [300, 800, 1200, 1800, 2300, 2700, 3000].forEach((x, i) => B.key(x, i % 2 ? 340 : 350));
    B.heart(1000, 320); B.heart(2200, 320); B.sharp(1400); B.sharp(2600); B.door(3110); } }
];

// ---------- načtení levelu ----------
function loadLevel(n){
  lvl = n; const d = LEVELS[n - 1]; W = d.w + 800; cols = Math.ceil(W / C);
  g = new Uint8Array(cols * ROWS); fg = new Uint8Array(cols * ROWS);
  fakes = []; objs = []; spawns = []; parts = []; door = null; door2 = null; bonus = false;
  d.build();
  // bonusový úsek za prvními dveřmi (otevře se po „Hrát dále a získat klíče")
  const bx = d.w;
  B.ground(bx, W); B.key(bx + 150); B.key(bx + 350, 340); B.spikes(bx + 250, 3); B.wall(bx + 450);
  B.enemy(bx + 620, 75, 400); B.key(bx + 560); B.key(bx + 700, 340); B.sharp(bx + 100);
  door2 = { x: W - 60 };
  gum = d.gum || GUM_MAX; keys = 0; timeLeft = d.time; doorCD = 0; stroke = { n: 0 };
  P = { x: 60, y: GT, vx: 0, vy: 0, w: 22, h: 48, face: 1, grounded: true, coy: 0, buf: 0, bufL: 0, leap: 0, leapT: 0, leapDir: 1, inv: 1.5 };
  safe = { x: 60, y: GT }; safeT = 0; camX = 0; paused = false; gumWarn = 0;
  toast(d.name + ' – ' + d.hint, 4.5);
}

// ---------- fyzika (hráč i nepřátelé) ----------
function physics(o, dt, stepUp){
  let dx = o.vx * dt, n = Math.ceil(Math.abs(dx) / 3), s = n ? dx / n : 0; o.blocked = false;
  for (let i = 0; i < n; i++){
    if (!hit(o.x + s, o.y, o.w, o.h)) o.x += s;
    else {
      let ok = false;
      if (o.grounded) for (let u = 2; u <= stepUp; u += 2) if (!hit(o.x + s, o.y - u, o.w, o.h)){ o.x += s; o.y -= u; ok = true; break; }
      if (!ok){ o.blocked = true; break; }
    }
  }
  o.vy = Math.min(o.vy + 1800 * dt, 900);
  const dy = o.vy * dt; n = Math.ceil(Math.abs(dy) / 3); s = n ? dy / n : 0; o.grounded = false;
  for (let i = 0; i < n; i++){
    if (!hit(o.x, o.y + s, o.w, o.h)) o.y += s;
    else { if (o.vy > 0) o.grounded = true; o.vy = 0; break; }
  }
}
function stepOnFake(o){
  if (!o.grounded) return;
  const cy = Math.floor((o.y + 1) / C);
  for (const px of [o.x - o.w / 2 + 2, o.x, o.x + o.w / 2 - 2]){
    const cx = Math.floor(px / C); if (cx < 0 || cx >= cols || cy >= ROWS) continue;
    const i = cy * cols + cx;
    if (g[i] === 2 && fg[i]){ const f = fakes[fg[i] - 1]; if (f.t === null){ f.t = 0.3; sfx(180, .25, 'sawtooth'); } }
  }
}

// ---------- efekty ----------
function crumb(x, y, col){ if (parts.length < 500) parts.push({ x, y, vx: (Math.random() - .5) * 120, vy: -Math.random() * 120, life: .6 + Math.random() * .5, col, s: 2 + Math.random() * 3 }); }
const cellCol = t => t === 1 ? '#8d5b2e' : t === 3 ? '#9ca7b3' : '#f0a53a';
function toast(msg, dur = 2){ const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, dur * 1000); }

// ---------- panely ----------
function panel(html, btns){
  paused = true; const p = $('panel'); p.innerHTML = html;
  (btns || []).forEach(b => { const e = document.createElement('button'); e.className = 'btn'; e.textContent = b.label;
    e.onclick = () => { p.style.display = 'none'; b.fn(); }; p.appendChild(e); });
  p.style.display = 'flex';
}
function startPanel(){
  panel('<h1>🧽 MAZEC</h1><p>Vymažeš cokoliv – ale <b>navždy</b>. I podlahu pod sebou!</p>' +
    '<p><b>A D / šipky</b> chůze · <b>mezerník</b> skok · <b>Enter</b> dlouhý skok vpřed<br>' +
    '<b>Levé tlačítko myši (drž a táhni)</b> = guma. Na mobilu přetáhni prstem.</p>' +
    '<p>Seber 5 🔑 klíčů a dojdi ke dveřím. Pozor na nepřátele, pasti, bomby a oranžovou falešnou podlahu!</p>',
    [{ label: '▶ Hrát od 1. levelu', fn: () => { hearts = 10; loadLevel(1); } }]);
  const row = document.createElement('div'); row.innerHTML = '<p>…nebo si vyber level:</p>';
  for (let i = 1; i <= 10; i++){ const s = document.createElement('span'); s.className = 'lv'; s.textContent = i;
    s.onclick = () => { $('panel').style.display = 'none'; hearts = 10; loadLevel(i); }; row.appendChild(s); }
  $('panel').appendChild(row);
}
function gameOver(){
  paused = true;
  panel('<h1>💔 Došla srdce</h1><p>Zkus to znovu – tentokrát chytřeji.</p>', [{ label: '↻ Zkusit level znovu', fn: () => { hearts = 10; loadLevel(lvl); } }]);
}
function levelDone(){
  sfx(660, .15); setTimeout(() => sfx(880, .25), 150);
  const left = Math.max(0, Math.ceil(timeLeft));
  if (lvl >= LEVELS.length){
    panel('<h1>🎉 Vyhrál jsi!</h1><p>Prošel jsi všech 10 levelů a vymazal celý svět.<br>Zbylo ti ' + hearts + ' srdcí.</p>',
      [{ label: '↻ Hrát znovu', fn: () => { hearts = 10; startPanel(); } }]);
  } else {
    panel('<h1>✅ Level ' + lvl + ' hotov!</h1><p>Zbývalo ti ' + left + ' s · srdcí: ' + hearts + '</p>',
      [{ label: 'Další level ▶', fn: () => loadLevel(lvl + 1) }]);
  }
}

// ---------- zranění, smrt, návrat ----------
function respawn(){
  P.x = safe.x; P.y = safe.y; P.vx = P.vy = 0; P.leap = 0; P.inv = 2.5;
  const cy0 = Math.floor(P.y / C);
  for (let cy = cy0; cy < cy0 + 3; cy++) for (let cx = Math.floor((P.x - 30) / C); cx <= Math.floor((P.x + 30) / C); cx++)
    if (cx >= 0 && cx < cols && cy < ROWS && !g[cy * cols + cx]) g[cy * cols + cx] = 1;   // opraví podlahu pod tebou
}
function hurt(msg, force){
  if (!force && P.inv > 0) return;
  hearts--; sfx(140, .35, 'sawtooth', .07); toast(msg + '  ❤ ' + hearts, 1.8);
  if (hearts <= 0){ gameOver(); return; }
  respawn();
}
function explode(b){
  const x = b.x, y = b.y - b.r; remove(b); shake = .5; sfx(80, .5, 'sawtooth', .09);
  const rr = 66, cr = Math.ceil(rr / C);
  for (let dy = -cr; dy <= cr; dy++) for (let dx = -cr; dx <= cr; dx++){
    const cx = Math.floor(x / C) + dx, cy = Math.floor(y / C) + dy;
    if (cx < 0 || cx >= cols || cy < 0 || cy >= ROWS) continue;
    const px = (cx + .5) * C, py = (cy + .5) * C;
    if ((px - x) ** 2 + (py - y) ** 2 <= rr * rr){ const i = cy * cols + cx; if (g[i]){ crumb(px, py, cellCol(g[i])); g[i] = 0; fg[i] = 0; } }
  }
  for (let i = 0; i < 40; i++) parts.push({ x, y, vx: (Math.random() - .5) * 400, vy: (Math.random() - .5) * 400, life: .5, col: Math.random() < .5 ? '#ff8a1f' : '#ffd23a', s: 4 });
  for (const o of objs.slice()){ const c = ctr(o); if (o !== b && Math.hypot(c.x - x, c.y - y) < 80 && (o.t === 'enemy' || o.t === 'spike')) remove(o); }
  if (Math.hypot(P.x - x, P.y - 24 - y) < 85) hurt('Výbuch!', true);
}

// ---------- objekty ----------
const remove = o => { const i = objs.indexOf(o); if (i >= 0) objs.splice(i, 1); };
function ctr(o){
  if (o.t === 'enemy') return { x: o.x, y: o.y - 14 };
  if (o.t === 'spike') return { x: o.x, y: o.y - 7 };
  if (o.t === 'bomb') return { x: o.x, y: o.y - o.r };
  return { x: o.x, y: o.y };
}

// ---------- mazání ----------
function objCost(){
  gum = Math.max(0, gum - 5); stroke.n++;
  if (stroke.n >= 2){ gum = Math.min(GUM_MAX, gum + 20); toast('KOMBO! +20 % gumy 🧽', 1.2); sfx(900, .15); }
}
function stamp(wx, wy){
  if (gum <= 0){ if (gumWarn <= 0){ toast('Došla guma! Najdi ořezávátko 🧽', 2); gumWarn = 3; } return; }
  const cr = Math.ceil(R / C), cx0 = Math.floor(wx / C), cy0 = Math.floor(wy / C); let n = 0;
  for (let dy = -cr; dy <= cr; dy++) for (let dx = -cr; dx <= cr; dx++){
    const cx = cx0 + dx, cy = cy0 + dy;
    if (cx < 0 || cx >= cols || cy < 0 || cy >= ROWS) continue;
    const i = cy * cols + cx; if (!g[i]) continue;
    const px = (cx + .5) * C, py = (cy + .5) * C;
    if ((px - wx) ** 2 + (py - wy) ** 2 <= R * R){ if (Math.random() < .25) crumb(px, py, cellCol(g[i])); g[i] = 0; fg[i] = 0; n++; }
  }
  if (n && Math.random() < .25) sfx(300 + Math.random() * 200, .05, 'triangle', .02);
  gum = Math.max(0, gum - n * COST);
  for (const o of objs.slice()){
    const c = ctr(o);
    if (o.t === 'bomb'){
      for (let i = 0; i < 9; i++){
        const sx = o.x + ((i % 3) - 1) * o.r * .8, sy = c.y + (((i / 3) | 0) - 1) * o.r * .8;
        if ((sx - wx) ** 2 + (sy - wy) ** 2 <= R * R) o.cov.add(i);
      }
      if (o.cov.size >= 9){ remove(o); objCost(); sfx(500, .1); toast('Bomba zneškodněna 💣', 1); }
    } else if (Math.hypot(c.x - wx, c.y - wy) < R + o.r){
      if (o.t === 'enemy' || o.t === 'spike'){ remove(o); objCost(); sfx(420, .1, 'triangle'); for (let k = 0; k < 10; k++) crumb(c.x, c.y, '#e0455a'); }
      else if (o.t === 'key'){ remove(o); toast('Smazal jsi klíč! 😱', 1.5); sfx(110, .3, 'sawtooth'); }
      else { remove(o); toast('Smazal jsi to…', 1); }
    }
  }
}
function endStroke(){
  for (const o of objs.slice()) if (o.t === 'bomb' && o.cov.size > 0) explode(o);   // napůl smazaná bomba vybuchne
  stroke = { n: 0 };
}

// ---------- vstup ----------
const K = {}; let jumpReq = false, leapReq = false, joyX = 0;
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.code)) e.preventDefault();
  if (e.repeat) return; K[e.code] = true;
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) jumpReq = true;
  if (e.code === 'Enter') leapReq = true;
});
addEventListener('keyup', e => K[e.code] = false);

let down = false, cur = { x: 0, y: 0 }, prev = { x: 0, y: 0 }, mouseIn = false, touchBrush = false;
const toGame = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * VW, y: (e.clientY - r.top) / r.height * VH }; };
cv.addEventListener('pointerdown', e => {
  if (paused || (e.pointerType === 'mouse' && e.button !== 0)) return;
  cv.setPointerCapture(e.pointerId); cur = toGame(e); prev = { ...cur }; down = true; touchBrush = e.pointerType !== 'mouse'; stroke = { n: 0 };
});
cv.addEventListener('pointermove', e => { cur = toGame(e); mouseIn = true; });
cv.addEventListener('pointerleave', () => mouseIn = false);
const up = () => { if (down){ down = false; endStroke(); } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('contextmenu', e => e.preventDefault());

// dotykové ovládání
(() => {
  const joy = $('joy'), knob = $('knob'); let jid = null;
  const setJ = e => { const r = joy.getBoundingClientRect(); let v = ((e.clientX - r.left) / r.width - .5) * 2.2;
    v = Math.max(-1, Math.min(1, v)); joyX = Math.abs(v) < .25 ? 0 : Math.sign(v);
    knob.style.left = (50 + v * 35) + '%'; };
  joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); setJ(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) setJ(e); });
  const rel = e => { if (e.pointerId === jid){ jid = null; joyX = 0; knob.style.left = '50%'; } };
  joy.addEventListener('pointerup', rel); joy.addEventListener('pointercancel', rel);
  $('bJump').addEventListener('pointerdown', () => jumpReq = true);
  $('bLeap').addEventListener('pointerdown', () => leapReq = true);
})();

// ---------- hlavní aktualizace ----------
function update(dt){
  T += dt; gumWarn -= dt; shake = Math.max(0, shake - dt);
  timeLeft -= dt;
  if (timeLeft <= 0){
    hearts--; sfx(140, .4, 'sawtooth', .07);
    if (hearts <= 0){ gameOver(); return; }
    toast('⏱ Čas vypršel! Level znovu  ❤ ' + hearts, 2.5); loadLevel(lvl); return;
  }

  // ovládání hráče
  const ax = (K.ArrowRight || K.KeyD ? 1 : 0) - (K.ArrowLeft || K.KeyA ? 1 : 0) || joyX;
  if (ax) P.face = ax > 0 ? 1 : -1;
  P.inv = Math.max(0, P.inv - dt);
  if (jumpReq) P.buf = .12; if (leapReq) P.bufL = .12; jumpReq = leapReq = false;
  P.buf -= dt; P.bufL -= dt; P.coy = P.grounded ? .1 : P.coy - dt;
  if (P.buf > 0 && P.coy > 0){ P.vy = -640; P.buf = 0; P.coy = 0; P.leap = 0; sfx(520, .1, 'square', .03); }
  else if (P.bufL > 0 && P.coy > 0){ P.vy = -520; P.bufL = 0; P.coy = 0; P.leap = 1; P.leapDir = P.face; P.leapT = 0; sfx(420, .15, 'square', .03); }
  if (P.leap){ P.vx = P.leapDir * 340; P.leapT += dt; if (P.grounded && P.leapT > .1) P.leap = 0; }
  else P.vx = ax * 200;
  physics(P, dt, 8);
  if (P.blocked) P.leap = 0;
  stepOnFake(P);
  if (P.y > VH + 60) hurt('Spadl jsi do prázdna!', true);

  // bezpečné místo pro návrat
  safeT -= dt;
  if (P.grounded && safeT <= 0){
    const cy = Math.floor((P.y + 1) / C); let ok = true;
    for (const px of [P.x - 9, P.x, P.x + 9]){ const t = cell(Math.floor(px / C), cy); if (t !== 1 && t !== 3) ok = false; }
    for (const o of objs) if ((o.t === 'enemy' && Math.abs(o.x - P.x) < 300) || ((o.t === 'spike' || o.t === 'bomb') && Math.abs(o.x - P.x) < 70)) ok = false;
    if (ok){ safe = { x: P.x, y: P.y }; safeT = .25; }
  }

  // kouzlení nepřátel zpoza rohu
  for (const s of spawns.slice()) if (P.x > s.trig){ objs.push(s.e); spawns.splice(spawns.indexOf(s), 1);
    for (let k = 0; k < 14; k++) parts.push({ x: s.e.x, y: s.e.y - 14, vx: (Math.random() - .5) * 200, vy: (Math.random() - .5) * 200, life: .5, col: '#fff', s: 3 }); }

  // objekty
  for (const o of objs.slice()){
    if (o.t === 'enemy'){
      const d = P.x - o.x;
      if (Math.abs(d) < o.aggro){ o.vx = Math.sign(d) * o.sp; o.face = Math.sign(d) || 1; } else o.vx = 0;
      physics(o, dt, 12); stepOnFake(o);
      if (o.y > VH + 80){ remove(o); continue; }
      if (Math.abs(P.x - o.x) < (P.w + o.w) / 2 - 2 && P.y - P.h < o.y && P.y > o.y - o.h) hurt('Chytl tě nepřítel!');
    } else if (o.t === 'spike' || o.t === 'bomb'){
      if (cell(Math.floor(o.x / C), Math.floor((o.y + 1) / C)) === 0){ o.vy += 1500 * dt; o.y += o.vy * dt; if (o.y > VH + 60) remove(o); } else o.vy = 0;
      if (o.t === 'spike' && Math.abs(P.x - o.x) < P.w / 2 + 8 && P.y > o.y - 12 && P.y - P.h < o.y) hurt('Píchl ses o hroty!');
    } else {
      if (Math.hypot(P.x - o.x, P.y - 24 - o.y) < 26){
        if (o.t === 'key'){ keys++; remove(o); sfx(900, .1, 'triangle', .05); toast('🔑 Klíč ' + keys + '/5', 1); }
        else if (o.t === 'heart'){ hearts = Math.min(15, hearts + 1); remove(o); sfx(700, .2, 'triangle', .05); toast('❤ Srdce navíc!', 1.2); }
        else if (o.t === 'sharp'){ gum = Math.min(GUM_MAX, gum + 120); remove(o); sfx(600, .2, 'triangle', .05); toast('Ořezávátko! +120 % gumy 🧽', 1.5); }
      }
    }
  }

  // mizení falešné podlahy
  for (const f of fakes) if (f.t !== null){
    f.t -= dt;
    if (f.t <= 0){ for (const i of f.cells) if (g[i] === 2){ crumb((i % cols + .5) * C, (Math.floor(i / cols) + .5) * C, '#f0a53a'); g[i] = 0; fg[i] = 0; } f.t = null; f.done = true; }
  }

  // dveře
  doorCD -= dt;
  if (door && !bonus && doorCD <= 0 && Math.abs(P.x - door.x) < 26 && P.y > GT - 60){
    if (keys >= 5) levelDone();
    else { doorCD = 99; panel('<h1>🚪 Zamčeno</h1><p>Máš jen ' + keys + ' z 5 klíčů.</p>',
      [{ label: 'Hrát dále a získat klíče', fn: () => { bonus = true; doorCD = 0; paused = false; timeLeft += 25;
        toast('Dveře zmizely! Jdi dál – za nimi jsou další klíče (+25 s)', 3.5); } }]); }
  }
  if (bonus && door2 && Math.abs(P.x - door2.x) < 26 && P.y > GT - 60){
    if (keys >= 5) levelDone();
    else { paused = true; panel('<h1>🚪 Poslední dveře</h1><p>Máš jen ' + keys + ' z 5 klíčů. Tady už je nutné je mít.</p>',
      [{ label: '↻ Hrát znovu tento level', fn: () => loadLevel(lvl) }]); }
  }

  // guma (držím a táhnu)
  if (down){
    const dist = Math.hypot(cur.x - prev.x, cur.y - prev.y), n = Math.max(1, Math.ceil(dist / (R * .5)));
    for (let s = 1; s <= n; s++) stamp(prev.x + (cur.x - prev.x) * s / n + camX, prev.y + (cur.y - prev.y) * s / n);
    prev = { ...cur };
  }

  // částice
  for (const p of parts){ p.life -= dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life > 0);

  // kamera
  const tx = Math.max(0, Math.min(W - VW, P.x - VW * .4)); camX += (tx - camX) * .15;
}

// ---------- kreslení ----------
function drawBg(){
  const gr = ctx.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, '#8cc4f4'); gr.addColorStop(1, '#d6edff');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 6; i++){ const x = ((i * 330 - camX * .15) % 1980 + 1980) % 1980 - 150, y = 50 + (i * 37) % 90;
    ctx.beginPath(); ctx.ellipse(x, y, 60, 18, 0, 0, 7); ctx.ellipse(x + 35, y - 10, 40, 16, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#4d9a3d'; for (let i = -1; i < 4; i++){ const x = i * 520 - (camX * .3 % 520); ctx.beginPath(); ctx.ellipse(x + 260, 420, 330, 190, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#5db84a'; for (let i = -1; i < 4; i++){ const x = i * 420 - (camX * .5 % 420); ctx.beginPath(); ctx.ellipse(x + 210, 440, 260, 110, 0, 0, 7); ctx.fill(); }
}
function drawTerrain(){
  const cx0 = Math.max(0, Math.floor(camX / C)), cx1 = Math.min(cols - 1, Math.ceil((camX + VW) / C)), ox = Math.round(camX);
  for (let cy = 0; cy < ROWS; cy++) for (let cx = cx0; cx <= cx1; cx++){
    const i = cy * cols + cx, t = g[i]; if (!t) continue;
    let col;
    if (t === 1) col = cell(cx, cy - 1) === 0 ? '#58b947' : ['#8d5b2e', '#82522a', '#96622f'][(cx * 7 + cy * 3) % 3];
    else if (t === 3) col = (cy % 5 === 0 || (cx + ((cy / 5 | 0) % 2) * 5) % 10 === 0) ? '#6f7a86' : ((cx + cy) % 3 ? '#9ca7b3' : '#8e99a6');
    else { const f = fakes[fg[i] - 1]; col = f && f.t !== null && Math.floor(T * 20) % 2 ? '#fff0b8' : ((cx + (cy >> 1)) % 4 < 2 ? '#f0a53a' : '#df8a22'); }
    ctx.fillStyle = col; ctx.fillRect(cx * C - ox, cy * C, C, C);
    if (cell(cx, cy + 1) === 0 && cy < ROWS - 1){ ctx.fillStyle = '#0003'; ctx.fillRect(cx * C - ox, cy * C + C - 2, C, 2); }
  }
}
function outline(){ ctx.lineWidth = 2.5; ctx.strokeStyle = '#14183a'; ctx.lineJoin = 'round'; }
function drawObj(o){
  const x = Math.round(o.x - camX);
  ctx.save(); outline();
  if (o.t === 'spike'){
    ctx.translate(x, o.y); ctx.fillStyle = '#cfd4de';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-5, -15); ctx.lineTo(0, 0); ctx.lineTo(5, -15); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (o.t === 'bomb'){
    const sh = o.cov.size ? Math.sin(T * 60) * 1.5 : 0; ctx.translate(x + sh, o.y - 14);
    ctx.fillStyle = o.cov.size && Math.floor(T * 12) % 2 ? '#c62828' : '#2b2b33';
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -13); ctx.quadraticCurveTo(10, -22, 16, -20); ctx.stroke();
    ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.arc(16, -20, 3 + Math.sin(T * 20), 0, 7); ctx.fill();
    ctx.fillStyle = '#fff6'; ctx.beginPath(); ctx.arc(-5, -5, 3, 0, 7); ctx.fill();
  } else if (o.t === 'key'){
    ctx.translate(x, o.y + Math.sin(T * 3 + o.x) * 3); ctx.fillStyle = '#ffcc1f';
    ctx.beginPath(); ctx.arc(-6, -4, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillRect(-1, -6, 14, 5); ctx.strokeRect(-1, -6, 14, 5); ctx.fillRect(8, -1, 3, 6); ctx.strokeRect(8, -1, 3, 6);
    ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc(-6, -4, 2, 0, 7); ctx.fill();
  } else if (o.t === 'heart'){
    ctx.translate(x, o.y + Math.sin(T * 3 + o.x) * 3); ctx.fillStyle = '#ee3355'; ctx.scale(1 + Math.sin(T * 6) * .06, 1 + Math.sin(T * 6) * .06);
    ctx.beginPath(); ctx.moveTo(0, 10); ctx.bezierCurveTo(-18, -2, -10, -16, 0, -6); ctx.bezierCurveTo(10, -16, 18, -2, 0, 10); ctx.fill(); ctx.stroke();
  } else if (o.t === 'sharp'){
    ctx.translate(x, o.y + Math.sin(T * 3 + o.x) * 3); ctx.rotate(-.2);
    ctx.fillStyle = '#ff8fb3'; ctx.fillRect(-14, -9, 28, 18); ctx.strokeRect(-14, -9, 28, 18);
    ctx.fillStyle = '#fff'; ctx.fillRect(-14, -9, 9, 18); ctx.strokeRect(-14, -9, 9, 18);
    ctx.font = 'bold 8px sans-serif'; ctx.fillStyle = '#14183a'; ctx.fillText('+120', -3, 3);
  } else if (o.t === 'enemy'){
    ctx.translate(x, o.y); const sq = Math.sin(T * 10 + o.x) * 1.5;
    ctx.fillStyle = '#e0455a'; ctx.beginPath(); ctx.ellipse(0, -13 + sq / 2, 15, 13 - sq, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; for (const ex of [-6, 6]){ ctx.beginPath(); ctx.arc(ex, -16, 4.5, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#14183a'; for (const ex of [-6, 6]){ ctx.beginPath(); ctx.arc(ex + o.face * 1.5, -15, 2, 0, 7); ctx.fill(); }
    ctx.beginPath(); ctx.moveTo(-11, -24); ctx.lineTo(-2, -20); ctx.moveTo(11, -24); ctx.lineTo(2, -20); ctx.stroke();
  }
  ctx.restore();
}
function drawDoor(dr){
  const x = Math.round(dr.x - camX), open = keys >= 5;
  ctx.save(); outline(); ctx.translate(x, GT);
  ctx.fillStyle = open ? '#3ecf6b' : '#8a5a2b'; ctx.fillRect(-20, -72, 40, 72); ctx.strokeRect(-20, -72, 40, 72);
  ctx.fillStyle = open ? '#d9ffe6' : '#a56a33'; ctx.fillRect(-14, -66, 28, 60);
  ctx.fillStyle = '#ffcc1f'; ctx.beginPath(); ctx.arc(9, -34, 3.5, 0, 7); ctx.fill();
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  const t = '🔑 ' + keys + '/5'; ctx.strokeText(t, 0, -80); ctx.fillText(t, 0, -80);
  ctx.restore();
}
function drawPlayer(){
  if (P.inv > 0 && Math.floor(P.inv * 12) % 2) return;
  ctx.save(); ctx.translate(Math.round(P.x - camX), Math.round(P.y)); ctx.scale(P.face, 1); outline();
  const moving = P.grounded && Math.abs(P.vx) > 1, wlk = moving ? Math.sin(T * 14) * 5 : 0, air = !P.grounded;
  // nohy a boty
  ctx.fillStyle = '#20304f';
  ctx.fillRect(-9 + (air ? -3 : wlk), -16, 8, 12); ctx.strokeRect(-9 + (air ? -3 : wlk), -16, 8, 12);
  ctx.fillRect(1 + (air ? 3 : -wlk), -16, 8, 12); ctx.strokeRect(1 + (air ? 3 : -wlk), -16, 8, 12);
  ctx.fillStyle = '#111';
  ctx.fillRect(-11 + (air ? -3 : wlk), -5, 12, 5); ctx.strokeRect(-11 + (air ? -3 : wlk), -5, 12, 5);
  ctx.fillRect(1 + (air ? 3 : -wlk), -5, 12, 5); ctx.strokeRect(1 + (air ? 3 : -wlk), -5, 12, 5);
  // tělo
  ctx.fillStyle = '#2f7bf5'; ctx.beginPath(); ctx.roundRect(-12, -36, 24, 24, 5); ctx.fill(); ctx.stroke();
  // ruce
  const wave = Math.sin(T * 8) * 4;
  const arm = (sx, ex, ey) => { ctx.fillStyle = '#2f7bf5'; ctx.beginPath(); ctx.moveTo(sx, -32); ctx.lineTo(ex, ey); ctx.lineWidth = 8; ctx.strokeStyle = '#14183a'; ctx.stroke();
    ctx.lineWidth = 4.5; ctx.strokeStyle = '#2f7bf5'; ctx.stroke(); outline(); ctx.fillStyle = '#f2b27c'; ctx.beginPath(); ctx.arc(ex, ey, 4.5, 0, 7); ctx.fill(); ctx.stroke(); };
  if (!moving && !air) arm(12, 16 + wave, -50); else arm(12, 16 + (air ? 4 : -wlk), air ? -48 : -20);
  arm(-12, -15 + (moving ? wlk : 0), air ? -46 : -18);
  // hlava
  ctx.fillStyle = '#f2b27c'; ctx.beginPath(); ctx.arc(0, -44, 11, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6b3f20'; ctx.beginPath(); ctx.arc(0, -44, 11.5, Math.PI * 1.02, Math.PI * 1.98); ctx.lineTo(8, -50); ctx.lineTo(-9, -48); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#14183a'; ctx.beginPath(); ctx.arc(-2, -44, 1.6, 0, 7); ctx.arc(5, -44, 1.6, 0, 7); ctx.fill();
  ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(2, -42, 4.5, .2, Math.PI - .2); ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 20, (Math.random() - .5) * shake * 20);
  drawBg(); drawTerrain();
  if (door && !bonus) drawDoor(door);
  if (door2) drawDoor(door2);
  objs.forEach(drawObj); drawPlayer();
  for (const p of parts){ ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - camX, p.y, p.s, p.s); } ctx.globalAlpha = 1;
  // guma (kurzor)
  if (!paused && ((mouseIn && !touchBrush) || down)){
    ctx.beginPath(); ctx.arc(cur.x, cur.y, R, 0, 7); ctx.fillStyle = down ? 'rgba(255,150,190,.55)' : 'rgba(255,150,190,.25)'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  ctx.restore();
}
function hud(){
  $('hearts').textContent = '❤'.repeat(Math.min(hearts, 15)) + ' ' + hearts;
  $('lvl').textContent = LEVELS[lvl - 1].name;
  const tl = Math.max(0, Math.ceil(timeLeft)); const te = $('time'); te.textContent = '⏱ ' + tl; te.style.color = tl <= 10 ? '#ff7070' : '#fff';
  $('keysH').textContent = '🔑 ' + keys + ' / 5';
  $('gumfill').style.width = (gum / GUM_MAX * 100) + '%'; $('gumtxt').textContent = Math.round(gum) + ' %';
}

// ---------- smyčka ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (!paused){ update(dt); }
  if (g){ render(); if (P) hud(); } else { drawBg(); }
  requestAnimationFrame(loop);
}
fit(); startPanel(); requestAnimationFrame(loop);
</script>
</body>
